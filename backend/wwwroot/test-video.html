<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Verification - AET LMS</title>
    <style>
        body { font-family: 'Inter', sans-serif; background: #0f172a; color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .container { background: #1e293b; padding: 2rem; border-radius: 1rem; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); width: 80%; max-width: 800px; }
        h1 { margin-top: 0; color: #38bdf8; text-align: center; }
        .info { margin-bottom: 1rem; color: #94a3b8; font-size: 0.9rem; text-align: center; }
        video { width: 100%; border-radius: 0.5rem; background: #000; aspect-ratio: 16/9; }
        input { width: 100%; padding: 0.5rem 0.75rem; border-radius: 0.5rem; border: 1px solid #334155; background: #0f172a; color: white; font-size: 1rem; margin-bottom: 0.75rem; box-sizing: border-box; }
        button { width: 100%; padding: 0.6rem; border-radius: 0.5rem; background: #38bdf8; color: #0f172a; font-weight: bold; border: none; cursor: pointer; font-size: 1rem; }
        button:hover { background: #7dd3fc; }
        label { color: #94a3b8; font-size: 0.85rem; display: block; margin-bottom: 0.4rem; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎬 AET LMS Video Test</h1>
        <p class="info">Nhập Asset ID để phát video từ Cloudflare R2</p>

        <label>Asset ID</label>
        <input type="text" id="assetId" value="e0718c7d-f2f1-4bdd-b772-53e0c864ce51" placeholder="xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx" />
        <button onclick="loadVideo()">Phát Video</button>
        <br/><br/>

        <video id="videoPlayer" controls>
            <p>Nhập Asset ID và nhấn "Phát Video" để bắt đầu.</p>
        </video>
    </div>

    <script>
        function loadVideo() {
            const assetId = document.getElementById('assetId').value.trim();
            if (!assetId) { alert('Vui lòng nhập Asset ID!'); return; }

            const video = document.getElementById('videoPlayer');
            video.src = `/api/v1/media/stream/${assetId}`;
            video.load();
            video.play().catch(e => console.log('Autoplay blocked, user must click play.'));
        }
    </script>
</body>
</html>
